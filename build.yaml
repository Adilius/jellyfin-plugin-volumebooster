overview: "Raise Jellyfin volume above 100% without transcoding."
description: >
  Lets the volume controls (arrow keys, mouse wheel, optional extra shortcuts)
  push the volume past 100%, up to 200%, in Jellyfin.
  No other plugins needed. mpv volume is cubic: 150% is about +10.6 dB.
