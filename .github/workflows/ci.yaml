name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: node scripts/check-version.mjs
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: client-bundle
          path: web/dist/volumebooster.js

  plugin:
    needs: js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: client-bundle
          path: Jellyfin.Plugin.VolumeBooster/Web
      # Both target frameworks: net9.0 (Jellyfin 10.11) and net10.0 (Jellyfin 12)
      - run: dotnet test Jellyfin.Plugin.VolumeBooster.slnx -c Release
      - run: pipx install jprm==1.1.0
      - name: Package both ABIs
        shell: pwsh
        run: |
          # package.ps1 rebuilds the bundle, so give it node deps
          npm --prefix web ci
          ./scripts/package.ps1 -Output artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plugin-zips
          path: artifacts/*.zip

  e2e:
    needs: plugin
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Jellyfin 10.11", image: "jellyfin/jellyfin:10.11.11", package: "0" }
          - { name: "Jellyfin 12.1", image: "jellyfin/jellyfin:12.1.20260915-010956", package: "1" }
    name: e2e (${{ matrix.name }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: plugin-zips
          path: artifacts
      - name: Install the plugin into a fresh config
        run: |
          mkdir -p "jf/config/plugins/Volume Booster" jf/media
          unzip -q artifacts/volume-booster_*.${{ matrix.package }}.zip -d "jf/config/plugins/Volume Booster"
          sudo chown -R 1000:1000 jf
      - name: Start Jellyfin
        run: docker run -d --name jf -p 8096:8096 --user 1000:1000 -v "$PWD/jf/config:/config" -v "$PWD/jf/media:/media" "${{ matrix.image }}"
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test --reporter=line
        working-directory: e2e
      - if: failure()
        run: docker logs jf | tail -200
