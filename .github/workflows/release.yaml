name: Release
# Publish a GitHub Release tagged vX.Y.Z.0 (matching build.yaml). This builds
# both ABI packages, attaches them, and adds them to manifest.json on main.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - name: Check tag matches build.yaml
        run: |
          node scripts/check-version.mjs
          v=$(sed -n 's/^version: *"\(.*\)"/\1/p' build.yaml)
          test "${{ github.event.release.tag_name }}" = "v$v" || { echo "tag ${{ github.event.release.tag_name }} != v$v"; exit 1; }
      - run: pipx install jprm==1.1.0
      - run: npm --prefix web ci
      - name: Test and package
        shell: pwsh
        run: |
          npm --prefix web test
          npm --prefix web run build
          dotnet test Jellyfin.Plugin.VolumeBooster.slnx -c Release
          if ($LASTEXITCODE) { exit 1 }
          ./scripts/package.ps1 -Output artifacts
      - name: Attach packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" artifacts/*.zip --clobber
      - name: Update manifest.json
        run: |
          base="https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}"
          for zip in artifacts/*.zip; do
            jprm repo add --plugin-url "$base/$(basename "$zip")" ./manifest.json "$zip"
          done
      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Update manifest for ${{ github.event.release.tag_name }}"
          git push origin main
